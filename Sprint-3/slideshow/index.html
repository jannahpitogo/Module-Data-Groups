<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <img id="carousel-img" src="./assets/nature1.jpg" alt="cat-pic" />

      <div>
        <button type="button" id="autobackward-btn">Auto Backward</button>
        <button type="button" id="backward-btn">Backward</button>
        <button type="button" id="stop-btn">Stop</button>
        <button type="button" id="forward-btn">Forward</button>
        <button type="button" id="autoforward-btn">Auto Forward</button>
      </div>
    </div>

    <script defer src="slideshow.js"></script>
  </body>
</html>
